services:
  db:
    image: mysql:oracle
    container_name: database
    restart: always
    networks:
      - isolated
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: mypassword

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: database-manager
    restart: always
    networks:
      - isolated
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

volumes:
  mysql-data:
  phpmyadmin-data:

networks:
  isolated:
    driver: bridge
